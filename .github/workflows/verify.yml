name: Offline repository checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e ./InstSCI
      - run: python scripts/verify_repository.py
      - run: python scripts/update_source_manifest.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s InstSCI-topic-library/tests -v
      - run: python -m unittest instsci.tests.test_zotero_mcp_handoff instsci.tests.test_fetcher_elsevier instsci.tests.test_fetch_result -v
      - run: python workflow.py doctor --profile research
      - run: python workflow.py demo
      - run: python scripts/check_empty_corpus.py
